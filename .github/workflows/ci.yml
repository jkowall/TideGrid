name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contracts:generate && git diff --exit-code -- packages/contracts/generated
      - run: pnpm build
      - run: pnpm release:dry
      - run: pnpm check:docs
      - run: pnpm check:prototype && pnpm test:prototype

  integration:
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'pull_request' }}
    # A disposable PostgreSQL 17 container per run, so CI spends no Neon
    # quota. tools/local-db/local-db.sh starts it from the pinned image, the
    # same script and image a local run uses, and exports DATABASE_URL and
    # TIDEGRID_EPHEMERAL_DB=1 (integration suites rotate tidegrid_app's
    # password; this database is disposable). The image's admin role creates
    # tidegrid_app through migration 0001, as on Neon, and the image ships
    # btree_gist with contrib.
    env:
      CI: "true"
      TIDEGRID_LOCAL_DB_ENGINE: docker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start PostgreSQL 17
        run: tools/local-db/local-db.sh up >> "$GITHUB_ENV"
      - name: Migrate, seed, and run integration tests
        run: |
          tools/local-db/local-db.sh prepare integration
          pnpm test:integration
      - name: PostgreSQL log
        if: always()
        run: tools/local-db/local-db.sh logs

  # Browser journeys and the installability check (G2.14b; D5(a), a
  # coordinator default pending owner confirmation). The built guest site runs
  # under its Worker in `wrangler dev`, first with a stub GuestGateway and no
  # database (part A), then bound to the API's GuestGateway, with the API in
  # `wrangler dev` on a disposable PostgreSQL 17 seeded with *.book.localhost
  # hosts (part B), through tools/local-db/local-db.sh. Chromium is
  # downloaded on the runner only.
  browser:
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'pull_request' }}
    env:
      CI: "true"
      TIDEGRID_LOCAL_DB_ENGINE: docker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        # Three tries: an apt mirror can refuse a request for a moment (a 403
        # from packages.microsoft.com failed run 40755745908 once).
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @tidegrid/guest-site exec playwright install --with-deps chromium && exit 0
            echo "Playwright install failed (attempt $attempt of 3)"
            sleep 20
          done
          exit 1
      - name: Build the guest site for the local API
        env:
          VITE_API_BASE: http://localhost:8961
          GUEST_LOCAL_API: http://localhost:8961
        run: pnpm --filter @tidegrid/guest-site build
      - name: Part A, stub gateway, no database
        run: pnpm --filter @tidegrid/guest-site e2e
      - name: Start PostgreSQL 17
        run: tools/local-db/local-db.sh up >> "$GITHUB_ENV"
      - name: Migrate, seed local hostnames, and prepare the runtime role
        # Also a third host for the second tenant, which the journey disables,
        # and the API's .dev.vars with a fresh runtime password.
        run: tools/local-db/local-db.sh prepare guest-e2e
      - name: Start the API on 8961
        run: |
          tools/local-db/local-db.sh api 8961 api.log \
            --var "GUEST_LINK_ORIGIN:http://{slug}.book.localhost:5361"
      - name: Part B, two brands against the API and the database
        env:
          E2E_MODE: full
          E2E_DISABLE_HOST: reef-e2e.book.localhost
          E2E_ADMIN_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm --filter @tidegrid/guest-site e2e
      - name: API log
        if: failure()
        run: cat api.log || true
      - name: PostgreSQL log
        if: always()
        run: tools/local-db/local-db.sh logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/guest-site/test-results
          retention-days: 7

  # Console browser journeys (G2.12d; D10(A), a coordinator default pending
  # owner confirmation). The built console runs under its Worker in
  # `wrangler dev`, so public/_headers and its CSP apply, bound to the API's
  # ConsoleGateway, with the API in `wrangler dev` on a disposable PostgreSQL
  # 17 seeded with the synthetic operators. Booking staff at both operators
  # book a walk-up guest through the test payment at 375 and 1280; finance
  # gets no way to book. Chromium is downloaded on the runner only. A job of
  # its own, apart from the guest site's, on ports 8981 and 5382.
  console-browser:
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'pull_request' }}
    env:
      CI: "true"
      TIDEGRID_LOCAL_DB_ENGINE: docker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        # Three tries: an apt mirror can refuse a request for a moment (a 403
        # from packages.microsoft.com failed run 40755745908 once).
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @tidegrid/operator-site exec playwright install --with-deps chromium && exit 0
            echo "Playwright install failed (attempt $attempt of 3)"
            sleep 20
          done
          exit 1
      - name: Build the console
        run: pnpm --filter @tidegrid/operator-site build
      - name: Start PostgreSQL 17
        run: tools/local-db/local-db.sh up >> "$GITHUB_ENV"
      - name: Migrate, seed, and prepare the runtime role
        # Local guest hosts, so the confirmation email's link has a verified
        # host; a booking staff member at the second operator, for its journey,
        # through app.ensure_staff_user in that operator's tenant context; and
        # the API's .dev.vars with a fresh runtime password.
        run: tools/local-db/local-db.sh prepare console-e2e
      - name: Start the API on 8981
        run: |
          tools/local-db/local-db.sh api 8981 api.log \
            --var "STAFF_ORIGINS:http://localhost:5382" --var "ALLOWED_ORIGINS:http://localhost:5382" \
            --var "GUEST_LINK_ORIGIN:http://{slug}.book.localhost:5361"
      - name: Console journeys at 375 and 1280, both operators
        run: pnpm --filter @tidegrid/operator-site e2e
      - name: API log
        if: failure()
        run: cat api.log || true
      - name: PostgreSQL log
        if: always()
        run: tools/local-db/local-db.sh logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-playwright-traces
          path: apps/operator-site/test-results
          retention-days: 7
