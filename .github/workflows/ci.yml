name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contracts:generate && git diff --exit-code -- packages/contracts/generated
      - run: pnpm build
      - run: pnpm release:dry
      - run: pnpm check:docs
      - run: pnpm check:prototype && pnpm test:prototype

  integration:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    # A disposable PostgreSQL 17 container per run, so CI spends no Neon
    # quota. The image's admin role creates tidegrid_app through migration
    # 0001, as on Neon, and the image ships btree_gist with contrib.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tidegrid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tidegrid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      # Integration suites rotate tidegrid_app's password; this database is disposable.
      TIDEGRID_EPHEMERAL_DB: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tidegrid
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate, seed, and run integration tests
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm test:integration
