name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contracts:generate && git diff --exit-code -- packages/contracts/generated
      - run: pnpm build
      - run: pnpm release:dry
      - run: pnpm check:docs
      - run: pnpm check:prototype && pnpm test:prototype

  integration:
    runs-on: ubuntu-latest
    # Same-repository pull requests only: forks cannot read secrets, and the
    # job must fail rather than skip when the key is missing.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create expiring Neon branch
        id: branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          test -n "$NEON_API_KEY" || { echo "NEON_API_KEY secret is not set"; exit 1; }
          out=$(pnpm --filter @tidegrid/database --silent neon:branch create "ci-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}")
          echo "::add-mask::$(echo "$out" | jq -r .connectionString)"
          echo "branch_id=$(echo "$out" | jq -r .branchId)" >> "$GITHUB_OUTPUT"
          echo "DATABASE_URL=$(echo "$out" | jq -r .connectionString)" >> "$GITHUB_ENV"
      - name: Migrate, seed, and run integration tests
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm test:integration
      - name: Delete Neon branch
        if: ${{ always() && steps.branch.outputs.branch_id != '' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: pnpm --filter @tidegrid/database --silent neon:branch delete "${{ steps.branch.outputs.branch_id }}"
