name: ci
# A dispatch names the commit it tested, so its run reads as step 9 evidence
# for that SHA; other events keep the default name.
run-name: ${{ inputs.sha && format('ci on {0}', inputs.sha) || '' }}

# Demo acceptance step 9 asks for every check green on the released SHA. All
# four jobs run on pull requests and on every push to main, so the merge
# commit that gets released has a run of its own. A dispatch runs them on a
# named commit, for a SHA released before this change or a canceled run.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA to check out and test (empty tests the branch head)
        required: false
        default: ""

permissions:
  contents: read

# A pull request's newer push cancels its older run. A push run on main is
# keyed by its event and commit, so no later push cancels it and each
# released SHA keeps its own complete run. A dispatch waits only behind
# another dispatch on the same SHA, and GitHub keeps the newest one pending.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || inputs.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: The commit under test
        # Step 9 evidence: the commit and tree this job tested, and the
        # workflow file that ran. On a pull request HEAD is the test merge
        # commit; on main and on a dispatch it is the released SHA itself. A
        # dispatch runs only from main, on a full SHA already on main, so no
        # unreviewed commit runs here. It is checked before any install or
        # test code, and the input is read from the environment, never
        # interpolated into the script.
        env:
          WANT: ${{ inputs.sha }}
        run: |
          got=$(git rev-parse HEAD)
          echo "commit $got tree $(git rev-parse 'HEAD^{tree}') ref $GITHUB_REF workflow $GITHUB_WORKFLOW_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A blank input tests the checked-out commit, under the same rules.
            want=${WANT:-$got}
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::start a dispatch from main, so main's workflow runs"; exit 1
            fi
            if ! printf '%s' "$want" | grep -Eqx '[0-9a-f]{40}'; then
              echo "::error::give the full 40-character SHA"; exit 1
            fi
            if [ "$got" != "$want" ]; then
              echo "::error::asked for $want but checked out $got"; exit 1
            fi
            git fetch --no-tags --quiet --unshallow origin main
            if ! git merge-base --is-ancestor "$want" FETCH_HEAD; then
              echo "::error::$want is not on main"; exit 1
            fi
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contracts:generate && git diff --exit-code -- packages/contracts/generated
      - run: pnpm build
      - run: pnpm release:dry
      - run: pnpm check:docs
      - run: pnpm check:prototype && pnpm test:prototype

  integration:
    runs-on: ubuntu-24.04
    # A disposable PostgreSQL 17 container per run, so CI spends no Neon
    # quota. tools/local-db/local-db.sh starts it from the pinned image, the
    # same script and image a local run uses, and exports DATABASE_URL and
    # TIDEGRID_EPHEMERAL_DB=1 (integration suites rotate tidegrid_app's
    # password; this database is disposable). The image's admin role creates
    # tidegrid_app through migration 0001, as on Neon, and the image ships
    # btree_gist with contrib.
    env:
      CI: "true"
      TIDEGRID_LOCAL_DB_ENGINE: docker
      # Below Linux's ephemeral range (32768-60999): the default 55432 is
      # inside it, so an earlier step's outgoing connection could already hold
      # it and docker fails with "address already in use" (run 43464837505).
      TIDEGRID_LOCAL_DB_PORT: "25432"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: The commit under test
        # Step 9 evidence: the commit and tree this job tested, and the
        # workflow file that ran. On a pull request HEAD is the test merge
        # commit; on main and on a dispatch it is the released SHA itself. A
        # dispatch runs only from main, on a full SHA already on main, so no
        # unreviewed commit runs here. It is checked before any install or
        # test code, and the input is read from the environment, never
        # interpolated into the script.
        env:
          WANT: ${{ inputs.sha }}
        run: |
          got=$(git rev-parse HEAD)
          echo "commit $got tree $(git rev-parse 'HEAD^{tree}') ref $GITHUB_REF workflow $GITHUB_WORKFLOW_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A blank input tests the checked-out commit, under the same rules.
            want=${WANT:-$got}
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::start a dispatch from main, so main's workflow runs"; exit 1
            fi
            if ! printf '%s' "$want" | grep -Eqx '[0-9a-f]{40}'; then
              echo "::error::give the full 40-character SHA"; exit 1
            fi
            if [ "$got" != "$want" ]; then
              echo "::error::asked for $want but checked out $got"; exit 1
            fi
            git fetch --no-tags --quiet --unshallow origin main
            if ! git merge-base --is-ancestor "$want" FETCH_HEAD; then
              echo "::error::$want is not on main"; exit 1
            fi
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start PostgreSQL 17
        run: tools/local-db/local-db.sh up >> "$GITHUB_ENV"
      - name: Migrate, seed, and run integration tests
        run: |
          tools/local-db/local-db.sh prepare integration
          pnpm test:integration
      - name: PostgreSQL log
        if: always()
        run: tools/local-db/local-db.sh logs

  # Browser journeys and the installability check (G2.14b; D5(a), a
  # coordinator default confirmed by the owner on 2026-11-08). The built guest
  # site runs
  # under its Worker in `wrangler dev`, first with a stub GuestGateway and no
  # database (part A), then bound to the API's GuestGateway, with the API in
  # `wrangler dev` on a disposable PostgreSQL 17 seeded with *.book.localhost
  # hosts (part B), through tools/local-db/local-db.sh. Chromium is
  # downloaded on the runner only.
  browser:
    runs-on: ubuntu-24.04
    env:
      CI: "true"
      TIDEGRID_LOCAL_DB_ENGINE: docker
      # Below Linux's ephemeral range (32768-60999): the default 55432 is
      # inside it, so an earlier step's outgoing connection could already hold
      # it and docker fails with "address already in use" (run 43464837505).
      TIDEGRID_LOCAL_DB_PORT: "25432"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: The commit under test
        # Step 9 evidence: the commit and tree this job tested, and the
        # workflow file that ran. On a pull request HEAD is the test merge
        # commit; on main and on a dispatch it is the released SHA itself. A
        # dispatch runs only from main, on a full SHA already on main, so no
        # unreviewed commit runs here. It is checked before any install or
        # test code, and the input is read from the environment, never
        # interpolated into the script.
        env:
          WANT: ${{ inputs.sha }}
        run: |
          got=$(git rev-parse HEAD)
          echo "commit $got tree $(git rev-parse 'HEAD^{tree}') ref $GITHUB_REF workflow $GITHUB_WORKFLOW_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A blank input tests the checked-out commit, under the same rules.
            want=${WANT:-$got}
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::start a dispatch from main, so main's workflow runs"; exit 1
            fi
            if ! printf '%s' "$want" | grep -Eqx '[0-9a-f]{40}'; then
              echo "::error::give the full 40-character SHA"; exit 1
            fi
            if [ "$got" != "$want" ]; then
              echo "::error::asked for $want but checked out $got"; exit 1
            fi
            git fetch --no-tags --quiet --unshallow origin main
            if ! git merge-base --is-ancestor "$want" FETCH_HEAD; then
              echo "::error::$want is not on main"; exit 1
            fi
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        # Three tries: an apt mirror can refuse a request for a moment (a 403
        # from packages.microsoft.com failed run 40755745908 once).
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @tidegrid/guest-site exec playwright install --with-deps chromium && exit 0
            echo "Playwright install failed (attempt $attempt of 3)"
            sleep 20
          done
          exit 1
      - name: Build the guest site for the local API
        env:
          VITE_API_BASE: http://localhost:8961
          GUEST_LOCAL_API: http://localhost:8961
        run: pnpm --filter @tidegrid/guest-site build
      - name: Part A, stub gateway, no database
        run: pnpm --filter @tidegrid/guest-site e2e
      - name: Start PostgreSQL 17
        run: tools/local-db/local-db.sh up >> "$GITHUB_ENV"
      - name: Migrate, seed local hostnames, and prepare the runtime role
        # Also a third host for the second tenant, which the journey disables,
        # and the API's .dev.vars with a fresh runtime password.
        run: tools/local-db/local-db.sh prepare guest-e2e
      - name: Start the API on 8961
        run: |
          tools/local-db/local-db.sh api 8961 api.log \
            --var "GUEST_LINK_ORIGIN:http://{slug}.book.localhost:5361"
      - name: Part B, two brands against the API and the database
        env:
          E2E_MODE: full
          E2E_DISABLE_HOST: reef-e2e.book.localhost
          E2E_ADMIN_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm --filter @tidegrid/guest-site e2e
      - name: API log
        if: failure()
        run: cat api.log || true
      - name: PostgreSQL log
        if: always()
        run: tools/local-db/local-db.sh logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: apps/guest-site/test-results
          retention-days: 7

  # Console browser journeys (G2.12d; D10(A), a coordinator default confirmed
  # by the owner on 2026-11-08). The built console runs under its Worker in
  # `wrangler dev`, so public/_headers and its CSP apply, bound to the API's
  # ConsoleGateway, with the API in `wrangler dev` on a disposable PostgreSQL
  # 17 seeded with the synthetic operators. Booking staff at both operators
  # book a walk-up guest through the test payment at 375 and 1280; finance
  # gets no way to book. Chromium is downloaded on the runner only. A job of
  # its own, apart from the guest site's, on ports 8981 and 5382.
  console-browser:
    runs-on: ubuntu-24.04
    env:
      CI: "true"
      TIDEGRID_LOCAL_DB_ENGINE: docker
      # Below Linux's ephemeral range (32768-60999): the default 55432 is
      # inside it, so an earlier step's outgoing connection could already hold
      # it and docker fails with "address already in use" (run 43464837505).
      TIDEGRID_LOCAL_DB_PORT: "25432"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: The commit under test
        # Step 9 evidence: the commit and tree this job tested, and the
        # workflow file that ran. On a pull request HEAD is the test merge
        # commit; on main and on a dispatch it is the released SHA itself. A
        # dispatch runs only from main, on a full SHA already on main, so no
        # unreviewed commit runs here. It is checked before any install or
        # test code, and the input is read from the environment, never
        # interpolated into the script.
        env:
          WANT: ${{ inputs.sha }}
        run: |
          got=$(git rev-parse HEAD)
          echo "commit $got tree $(git rev-parse 'HEAD^{tree}') ref $GITHUB_REF workflow $GITHUB_WORKFLOW_SHA"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A blank input tests the checked-out commit, under the same rules.
            want=${WANT:-$got}
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::start a dispatch from main, so main's workflow runs"; exit 1
            fi
            if ! printf '%s' "$want" | grep -Eqx '[0-9a-f]{40}'; then
              echo "::error::give the full 40-character SHA"; exit 1
            fi
            if [ "$got" != "$want" ]; then
              echo "::error::asked for $want but checked out $got"; exit 1
            fi
            git fetch --no-tags --quiet --unshallow origin main
            if ! git merge-base --is-ancestor "$want" FETCH_HEAD; then
              echo "::error::$want is not on main"; exit 1
            fi
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        # Three tries: an apt mirror can refuse a request for a moment (a 403
        # from packages.microsoft.com failed run 40755745908 once).
        run: |
          for attempt in 1 2 3; do
            pnpm --filter @tidegrid/operator-site exec playwright install --with-deps chromium && exit 0
            echo "Playwright install failed (attempt $attempt of 3)"
            sleep 20
          done
          exit 1
      - name: Build the console
        run: pnpm --filter @tidegrid/operator-site build
      - name: Start PostgreSQL 17
        run: tools/local-db/local-db.sh up >> "$GITHUB_ENV"
      - name: Migrate, seed, and prepare the runtime role
        # Local guest hosts, so the confirmation email's link has a verified
        # host; a booking staff member at the second operator, for its journey,
        # through app.ensure_staff_user in that operator's tenant context; and
        # the API's .dev.vars with a fresh runtime password.
        run: tools/local-db/local-db.sh prepare console-e2e
      - name: Start the API on 8981
        run: |
          tools/local-db/local-db.sh api 8981 api.log \
            --var "STAFF_ORIGINS:http://localhost:5382" --var "ALLOWED_ORIGINS:http://localhost:5382" \
            --var "GUEST_LINK_ORIGIN:http://{slug}.book.localhost:5361"
      - name: Console journeys at 375 and 1280, both operators
        run: pnpm --filter @tidegrid/operator-site e2e
      - name: API log
        if: failure()
        run: cat api.log || true
      - name: PostgreSQL log
        if: always()
        run: tools/local-db/local-db.sh logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: console-playwright-traces
          path: apps/operator-site/test-results
          retention-days: 7
