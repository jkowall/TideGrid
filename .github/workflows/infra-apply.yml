name: infra-apply
# Added 2026-11-10 (owner request: "you can set those up anytime you want on
# cloudflare"). Plans and applies one Terraform environment from GitHub, so no
# laptop holds state or credentials. Staging only for now. Each run waits
# twice for the owner's approval on the environment: once before the plan
# reads any secret, and once more before the saved plan is applied. See
# docs/runbooks/terraform-apply.md, "From GitHub".
run-name: ${{ format('infra {0} {1}', inputs.environment, inputs.action) }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment
        type: choice
        options: [staging]
        required: true
      action:
        description: plan only, or plan then apply after a second approval
        type: choice
        options: [plan, apply]
        default: plan
        required: true

permissions:
  contents: read

# One run per environment at a time, never cancelled midway.
concurrency:
  group: infra-apply-${{ inputs.environment }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TERRAFORM_VERSION: 1.13.5
  TERRAFORM_SHA256: 0dbe3fcc268eb670801af6a6456799d1ae26e72e73797f6c6167e18aafd1fd9a
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  ROOT: infra/terraform/environments/${{ inputs.environment }}

jobs:
  # No secrets. The same repository guards as infra.yml, on this exact
  # commit, before anyone is asked to approve the plan.
  guards:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Repository guards
        run: |
          bad=$(git ls-files infra | grep -E '(\.tfstate(\..*)?|\.tfvars(\.json)?|backend\.hcl|\.terraform/)' || true)
          if [ -n "$bad" ]; then
            echo "::error::committed state, tfvars, or backend settings: $bad"; exit 1
          fi
          if grep -rnE 'resource +"neon_role"' infra/terraform; then
            echo "::error::Terraform must not create a Neon role"; exit 1
          fi
          if grep -rnE 'resource +"cloudflare_(workers_script|worker_version|workers_deployment|worker|workers_custom_domain|queue_consumer)"' infra/terraform; then
            echo "::error::Worker scripts, versions, deployments, custom domains, and queue consumers belong to Wrangler"; exit 1
          fi

  plan:
    needs: guards
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: infra-${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_neon_project_id: ${{ vars.NEON_PROJECT_ID }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    outputs:
      changes: ${{ steps.summary.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Settings are present
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN NEON_API_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY \
                   TF_VAR_cloudflare_account_id TF_VAR_zone_id TF_VAR_neon_project_id; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing on the infra-${{ inputs.environment }} environment:$missing (see docs/runbooks/terraform-apply.md)"; exit 1
          fi
          if [ -n "$ALERT_EMAIL" ]; then
            printf 'TF_VAR_alert_email_destinations=["%s"]\n' "$ALERT_EMAIL" >> "$GITHUB_ENV"
          fi

      - name: Install Terraform
        run: |
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLo "$RUNNER_TEMP/$zip" "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${zip}"
          echo "${TERRAFORM_SHA256}  $RUNNER_TEMP/$zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/terraform"
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"

      - name: Init against the state bucket in Cloudflare R2
        # Owner decision pending (D2, 2026-11-10 recommendation): state lives
        # in a private R2 bucket in the same account instead of a new AWS
        # account. R2 encrypts at rest and supports the conditional writes
        # use_lockfile needs. It has no version history, so a copy of the
        # state is kept before each apply (below).
        run: |
          cat > "$RUNNER_TEMP/backend.hcl" <<EOF
          bucket                      = "tidegrid-terraform-state"
          key                         = "tidegrid/${{ inputs.environment }}.tfstate"
          region                      = "auto"
          endpoints                   = { s3 = "https://${TF_VAR_cloudflare_account_id}.r2.cloudflarestorage.com" }
          use_path_style              = true
          use_lockfile                = true
          skip_credentials_validation = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_s3_checksum            = true
          EOF
          terraform -chdir="$ROOT" init -backend-config="$RUNNER_TEMP/backend.hcl"

      - name: Plan
        run: terraform -chdir="$ROOT" plan -lock-timeout=5m -out="$RUNNER_TEMP/env.tfplan" > /dev/null

      - name: Summary for the owner (names and actions only, no values)
        id: summary
        run: |
          terraform -chdir="$ROOT" show -json "$RUNNER_TEMP/env.tfplan" > "$RUNNER_TEMP/plan.json"
          jq -r '.resource_changes[] | select(.mode == "managed") | select(.change.actions != ["no-op"]) | "\(.change.actions | join("+"))\t\(.address)"' \
            "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/changes.txt"
          # Output changes count too, so an output-only plan still applies.
          jq -r '(.output_changes // {}) | to_entries[] | select(.value.actions != ["no-op"]) | "\(.value.actions | join("+"))\toutput.\(.key)"' \
            "$RUNNER_TEMP/plan.json" >> "$RUNNER_TEMP/changes.txt"
          count=$(wc -l < "$RUNNER_TEMP/changes.txt")
          echo "changes=$count" >> "$GITHUB_OUTPUT"
          {
            echo "## ${{ inputs.environment }}: $count change(s)"
            echo
            echo '| Action | Resource |'
            echo '|---|---|'
            sed 's/\t/ | /; s/^/| /; s/$/ |/' "$RUNNER_TEMP/changes.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          # Runbook rule: no destroy or replace without a separate go.
          if grep -v $'\toutput\.' "$RUNNER_TEMP/changes.txt" | grep -q 'delete'; then
            echo "::error::the plan deletes or replaces something; stop and ask the owner"; exit 1
          fi

      - name: Keep the saved plan for the apply job
        if: inputs.action == 'apply' && steps.summary.outputs.changes != '0'
        run: cp "$ROOT/.terraform.lock.hcl" "$RUNNER_TEMP/"
      - if: inputs.action == 'apply' && steps.summary.outputs.changes != '0'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ inputs.environment }}
          path: |
            ${{ runner.temp }}/env.tfplan
            ${{ runner.temp }}/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 1

  apply:
    needs: plan
    if: inputs.action == 'apply' && needs.plan.outputs.changes != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Second approval: the owner reads the plan job's summary, then approves.
    environment: infra-${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Terraform
        run: |
          zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          curl -fsSLo "$RUNNER_TEMP/$zip" "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${zip}"
          echo "${TERRAFORM_SHA256}  $RUNNER_TEMP/$zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/terraform"
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v7
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ runner.temp }}/plan

      - name: Init with the plan's provider lock
        run: |
          cp "$RUNNER_TEMP/plan/.terraform.lock.hcl" "$ROOT/"
          cat > "$RUNNER_TEMP/backend.hcl" <<EOF
          bucket                      = "tidegrid-terraform-state"
          key                         = "tidegrid/${{ inputs.environment }}.tfstate"
          region                      = "auto"
          endpoints                   = { s3 = "https://${TF_VAR_cloudflare_account_id}.r2.cloudflarestorage.com" }
          use_path_style              = true
          use_lockfile                = true
          skip_credentials_validation = true
          skip_region_validation      = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_s3_checksum            = true
          EOF
          terraform -chdir="$ROOT" init -lockfile=readonly -backend-config="$RUNNER_TEMP/backend.hcl"

      - name: Copy the current state before changing it (R2 has no version history)
        env:
          # R2 does not accept the newer default checksums of the AWS CLI.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          # Fail closed: skip the copy only when the state object is
          # confirmed missing (first apply); any other read error stops here.
          r2="https://${TF_VAR_cloudflare_account_id}.r2.cloudflarestorage.com"
          src="s3://tidegrid-terraform-state/tidegrid/${{ inputs.environment }}.tfstate"
          set +e
          head=$(aws s3api head-object --bucket tidegrid-terraform-state \
            --key "tidegrid/${{ inputs.environment }}.tfstate" \
            --endpoint-url "$r2" --region auto 2>&1)
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            if printf '%s' "$head" | grep -qE '\(404\)|Not Found|NoSuchKey'; then
              echo "no state yet (first apply)"; exit 0
            fi
            echo "::error::could not read the state object; not applying without a backup"; exit 1
          fi
          aws s3 cp "$src" \
            "s3://tidegrid-terraform-state/backups/${{ inputs.environment }}/$(date -u +%Y%m%dT%H%M%SZ)-run${{ github.run_id }}.tfstate" \
            --endpoint-url "$r2" --region auto --only-show-errors

      - name: Apply the saved plan
        run: terraform -chdir="$ROOT" apply -lock-timeout=5m "$RUNNER_TEMP/plan/env.tfplan"

      - name: What Wrangler needs (names only)
        run: |
          {
            echo "## Applied ${{ inputs.environment }}"
            echo
            echo "Queue and bucket names for the Wrangler configuration:"
            echo
            echo '```'
            terraform -chdir="$ROOT" output -json wrangler_inputs | jq '{queue_names, dead_letter_queue_names, bucket_names}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
