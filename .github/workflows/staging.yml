name: staging
# Staging rehearsal (goal W3-PREPILOT, then W3-CLG-1). Migrates the staging
# Neon branch, deploys the staging API and console Workers, and gathers the
# pre-pilot evidence. Staging only: tools/staging/resolve.sh refuses any
# branch that could be Neon main, the probes refuse any API but
# api-staging, and nothing here touches production Workers or Neon main.
# See docs/runbooks/staging.md.
run-name: ${{ format('staging {0} {1}', inputs.action, inputs.sha) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: rehearse (everything below, in order, under one approval), deploy-and-probe (deploy then probes, no integration, about 6 minutes), or one part on its own - deploy (migrate, seed, connect, deploy), probes (latency, read-after-write, restart), integration (the fairness, race, capacity, and tenant isolation suites on a throwaway branch of staging)
        type: choice
        options: [rehearse, deploy-and-probe, deploy, probes, integration]
        default: rehearse
        required: true
      sha:
        description: Full 40-character commit SHA on main
        required: true
      rotate:
        description: deploy and rehearse only. Give tidegrid_app a new password even when staging already has one
        type: boolean
        default: false
      origin:
        description: probes and rehearse only. A synthetic tenant's booking site origin the staging database knows
        default: https://demo-harbor.book.tidegrid.us

permissions:
  contents: read

# One staging run at a time: a deploy and a restart probe must not overlap.
concurrency:
  group: staging
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # No secrets. Refuses before anyone is asked to approve.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The commit is on main
        env:
          WANT: ${{ inputs.sha }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::start this workflow from main, so main's workflow runs"; exit 1
          fi
          if ! printf '%s' "$WANT" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::give the full 40-character SHA"; exit 1
          fi
          git cat-file -e "$WANT^{commit}" 2>/dev/null || { echo "::error::$WANT is not a commit here"; exit 1; }
          git merge-base --is-ancestor "$WANT" refs/remotes/origin/main || { echo "::error::$WANT is not on main"; exit 1; }

  staging:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Required reviewer: the owner. Holds CLOUDFLARE_API_TOKEN, NEON_API_KEY,
    # CLOUDFLARE_ACCOUNT_ID, NEON_PROJECT_ID, and ALERT_EMAIL (the OpenTofu
    # credentials that built staging).
    environment: infra-staging
    env:
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Dependencies install before any secret is in an environment.
      - run: pnpm install --frozen-lockfile
      - name: Find staging (never Neon main)
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: tools/staging/resolve.sh >> "$GITHUB_ENV"

      # ---- deploy ----
      - name: Preflight (token can deploy, staging is not ahead of this SHA)
        # Both checks run before anything changes, so a run that would stop
        # halfway stops here instead.
        if: inputs.action == 'deploy' || inputs.action == 'deploy-and-probe' || inputs.action == 'rehearse'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cf="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          for what in workers/scripts hyperdrive/configs; do
            ok=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$cf/$what" | jq -r '.success // false')
            [ "$ok" = true ] || { echo "::error::the infra-staging Cloudflare token cannot read $what; it needs the permissions in docs/runbooks/staging.md"; exit 1; }
          done
          (cd packages/database/migrations && ls -1 *.sql | LC_ALL=C sort) > "$RUNNER_TEMP/tree.txt"
          exists=$(psql "$STAGING_ADMIN_URL" -XAtq -v ON_ERROR_STOP=1 -c "select to_regclass('public.schema_migrations') is not null")
          if [ "$exists" = t ]; then
            psql "$STAGING_ADMIN_URL" -XAtq -v ON_ERROR_STOP=1 -c "select name from public.schema_migrations" | LC_ALL=C sort > "$RUNNER_TEMP/catalog.txt"
          else
            : > "$RUNNER_TEMP/catalog.txt"
          fi
          ahead=$(LC_ALL=C comm -13 "$RUNNER_TEMP/tree.txt" "$RUNNER_TEMP/catalog.txt")
          if [ -n "$ahead" ]; then
            echo "::error::staging has migrations this SHA does not: $(echo $ahead). Deploy a newer SHA"; exit 1
          fi
      - name: Migrate and seed staging
        if: inputs.action == 'deploy' || inputs.action == 'deploy-and-probe' || inputs.action == 'rehearse'
        run: |
          export DATABASE_URL="$STAGING_ADMIN_URL"
          pnpm --silent --filter @tidegrid/database migrate:status | tail -3
          pnpm db:migrate
          # Synthetic demo operators only, idempotent.
          pnpm db:seed
          last=$(ls packages/database/migrations | grep -E '^[0-9]{4}_.+\.sql$' | LC_ALL=C sort | tail -1)
          # Health reports schema_migrations.name, which keeps the .sql suffix.
          echo "LAST_MIGRATION=$last" >> "$GITHUB_ENV"
          echo "staging migrated through $last" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Deploy the staging API
        if: inputs.action == 'deploy' || inputs.action == 'deploy-and-probe' || inputs.action == 'rehearse'
        working-directory: apps/api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env staging --var "BUILD_ID:${SHA:0:7}"
      - name: Connect it to the staging database and set its secrets
        if: inputs.action == 'deploy' || inputs.action == 'deploy-and-probe' || inputs.action == 'rehearse'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          ROTATE: ${{ inputs.rotate }}
        run: |
          flag=""; [ "$ROTATE" = true ] && flag=--rotate
          tools/staging/configure.sh $flag | tee -a "$GITHUB_ENV"
      - name: Deploy the staging console
        if: inputs.action == 'deploy' || inputs.action == 'deploy-and-probe' || inputs.action == 'rehearse'
        working-directory: apps/operator-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm build
          pnpm exec wrangler deploy --env staging
      - name: Staging answers on the new commit and schema
        if: inputs.action == 'deploy' || inputs.action == 'deploy-and-probe' || inputs.action == 'rehearse'
        run: |
          for i in $(seq 1 24); do
            body=$(curl -fsS https://api-staging.tidegrid.us/v1/health || true)
            if [ "$(jq -r '.version // empty' <<<"$body" 2>/dev/null)" = "${SHA:0:7}" ] \
              && [ "$(jq -r '.migrations.latest // empty' <<<"$body")" = "$LAST_MIGRATION" ]; then
              echo "health: $(jq -c '{version, environment, database, migrations}' <<<"$body")" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "Hyperdrive config: $HYPERDRIVE_ID" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::staging health did not show ${SHA:0:7} and $LAST_MIGRATION: $(jq -c '{version, database, migrations}' <<<"$body" 2>/dev/null || echo unreachable)"
          exit 1

      # ---- probes ----
      - name: Placement latency and read-after-write
        if: inputs.action == 'probes' || inputs.action == 'deploy-and-probe' || inputs.action == 'rehearse'
        env:
          PROBE_API: https://api-staging.tidegrid.us
          PROBE_ORIGIN: ${{ inputs.origin }}
        run: pnpm --silent --filter @tidegrid/release staging-probe latency raw | tee -a "$RUNNER_TEMP/probes.ndjson"
      - name: Compute restart, then read-after-write
        if: inputs.action == 'probes' || inputs.action == 'deploy-and-probe' || inputs.action == 'rehearse'
        env:
          PROBE_API: https://api-staging.tidegrid.us
          PROBE_ORIGIN: ${{ inputs.origin }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: pnpm --silent --filter @tidegrid/release staging-probe restart | tee -a "$RUNNER_TEMP/probes.ndjson"

      # ---- integration ----
      - name: Fairness, race, capacity, and isolation suites on a throwaway branch of staging
        if: inputs.action == 'integration' || inputs.action == 'rehearse'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          out="$RUNNER_TEMP/branch.json"
          pnpm --silent --filter @tidegrid/database exec tsx src/neon-branch.ts create "it-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --ttl 4 --parent "$STAGING_BRANCH_ID" --out "$out"
          branch=$(jq -r .branchId "$out")
          trap 'pnpm --silent --filter @tidegrid/database exec tsx src/neon-branch.ts delete "$branch" || true; rm -f "$out"' EXIT
          url=$(jq -r .connectionString "$out")
          echo "::add-mask::$url"
          pw=$(node -e 'process.stdout.write(decodeURIComponent(new URL(process.argv[1]).password))' "$url")
          [ -n "$pw" ] && echo "::add-mask::$pw"
          echo "throwaway branch $branch from staging" | tee -a "$GITHUB_STEP_SUMMARY"
          # The suites expect an empty database, as in CI (a fresh PostgreSQL
          # container): some list every tenant. Empty the copy so the suites migrate it from 0001
          # on the same Neon project, region, and compute size as staging.
          # tidegrid_app is a cluster role and survives; 0001 reuses it.
          PGOPTIONS='-c client_min_messages=warning' psql "$url" -XAtq -v ON_ERROR_STOP=1 \
            -c 'DROP SCHEMA IF EXISTS app CASCADE' -c 'DROP SCHEMA public CASCADE' -c 'CREATE SCHEMA public' >/dev/null
          # A focused set, most important first: every sweep fairness suite,
          # then the last-unit race, capacity, and tenant isolation suites. The
          # whole integration suite took over 95 minutes on Neon (run
          # 43871800993: every query crosses the network), and some suites need
          # a PostgreSQL superuser, which Neon does not give: they set
          # session_replication_role or clone a template database. The search
          # benchmark is one of them (it bulk-loads with triggers off). Every
          # suite still runs on each pull request in CI.
          raw="$RUNNER_TEMP/integration.raw"
          : > "$raw"
          deadline=$(( $(date +%s) + 95 * 60 ))
          status=0
          suites() {
            local pkg=$1; shift
            local left=$(( deadline - $(date +%s) ))
            if [ "$left" -le 60 ]; then
              echo "== $pkg $*: not run, integration stopped at the 95-minute limit" >> "$raw"; status=124; return
            fi
            echo "== $pkg $*" >> "$raw"
            local s=0
            # The suites get only the throwaway branch, not staging's own URL or the Neon key.
            env -u STAGING_ADMIN_URL -u NEON_API_KEY \
              DATABASE_URL="$url" TIDEGRID_EPHEMERAL_DB=1 TIDEGRID_NEON_BRANCH=1 CI=true \
              timeout --kill-after=1m "${left}s" pnpm --silent --filter "$pkg" exec \
                vitest run --config vitest.integration.config.ts "$@" >> "$raw" 2>&1 || s=$?
            if [ "$s" -eq 124 ]; then echo "integration stopped at the 95-minute limit" >> "$raw"; status=124
            elif [ "$s" -ne 0 ] && [ "$status" -eq 0 ]; then status=$s; fi
          }
          set +e
          suites @tidegrid/domain-booking src/sweep-fairness.integration.test.ts
          suites @tidegrid/domain-inventory src/sweep-fairness.integration.test.ts
          suites @tidegrid/domain-messaging src/sweep-fairness.integration.test.ts
          suites @tidegrid/domain-hostnames src/sweep-fairness.integration.test.ts
          suites @tidegrid/domain-booking src/adversarial/races.integration.test.ts \
            src/adversarial/chain-and-tenancy.integration.test.ts src/adversarial/expiry.integration.test.ts \
            src/adversarial/recovery.integration.test.ts
          suites @tidegrid/domain-inventory src/capacity-override.integration.test.ts
          suites @tidegrid/api-worker test-integration/capacity-adversarial.integration.test.ts \
            test-integration/capacity.integration.test.ts test-integration/tenant-access.integration.test.ts
          set -e
          # Only the totals, failure, and fairness lines are kept: the raw log
          # stays on the runner, because masking covers the live log only.
          # Error lines say why a test failed; any line naming a connection
          # string or the password is dropped.
          grep -E '^== |Test Files|Tests  |FAIL|fairness|Error|error:|minute limit' "$raw" \
            | grep -v -F "${pw:-no-password-to-filter}" | grep -v -E 'postgres(ql)?://' \
            | cut -c1-600 > "$RUNNER_TEMP/integration.log" || true
          rm -f "$raw"
          { echo '```'; head -n 300 "$RUNNER_TEMP/integration.log" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # The same filtered lines in the job log, which the API can read
          # when the run page and artifact cannot be opened.
          echo "::group::integration results (filtered)"; head -n 300 "$RUNNER_TEMP/integration.log" || true; echo "::endgroup::"
          exit "$status"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-${{ inputs.action }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/probes.ndjson
            ${{ runner.temp }}/integration.log
          if-no-files-found: ignore
          retention-days: 90
